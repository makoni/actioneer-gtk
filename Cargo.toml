[package]
name = "actioneer"
version = "1.1.0"
edition = "2024"
authors = ["Sergey Armodin"]
description = "GitHub Actions client for Linux (GNOME)"
license = "MIT"

[dependencies]
# GTK4 and libadwaita

gtk4 = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
gio = "0.22"

# HTTP client and async runtime
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.23"

# Secret storage
keyring = "4.1"
keyring-core = "1.0"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
sha2 = "0.11"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "notification", "secret"] }

# Open URLs
open = "5.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettextrs = { version = "0.8", package = "gettext-rs", features = ["gettext-system"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
dirs = "6.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"

[dev-dependencies]
# Testing HTTP mocks
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.12"
