[package]
name = "actioneer"
version = "1.0.1"
edition = "2024"
authors = ["Sergey Armodin"]
description = "GitHub Actions client for Linux (GNOME)"
license = "MIT"

[dependencies]
# GTK4 and libadwaita

gtk4 = { version = "0.10", package = "gtk4" }
libadwaita = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
gio = "0.21"

# HTTP client and async runtime
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Secret storage
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

# Open URLs
open = "5.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
dirs = "6.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"

[dev-dependencies]
# Testing HTTP mocks
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.12"
