name: Lockfile Sync

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lock-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Install flatpak-cargo-generator
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet pipx
          python3 -m pipx ensurepath
          python3 -m pipx install flatpak-cargo-generator
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ensure Cargo.lock and Flatpak manifest match
        run: scripts/check-flatpak-lock-sync.sh
