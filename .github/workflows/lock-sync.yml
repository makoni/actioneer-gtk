name: Lockfile Sync

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lock-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Install flatpak-cargo-generator
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sL \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py \
            -o "$HOME/.local/bin/flatpak-cargo-generator"
          chmod +x "$HOME/.local/bin/flatpak-cargo-generator"
          python3 -m pip install --user --quiet aiohttp toml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ensure Cargo.lock and Flatpak manifest match
        run: scripts/check-flatpak-lock-sync.sh
