---
name: Snap CI

"on":
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the Snap artifacts
        value: ${{ jobs.build.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build snap
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Build snap for ${{ matrix.platform }}
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --build-for=${{ matrix.platform }}

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.snap }}
          path: ${{ steps.build.outputs.snap }}
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      # - name: Publish to store
      #   uses: snapcore/action-publish@v1
