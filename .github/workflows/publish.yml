name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for the draft release (e.g., v1.0.0)
        required: true
      name:
        description: Optional release title (defaults to the tag)
        required: false
      notes:
        description: Optional release notes (defaults to a placeholder)
        required: false

jobs:
  flatpak:
    uses: ./.github/workflows/flatpak-ci.yml
    secrets: inherit

  snap:
    uses: ./.github/workflows/snap-ci.yml
    secrets: inherit

  appimage:
    uses: ./.github/workflows/appimage-ci.yml
    secrets: inherit

  release:
    needs: [flatpak, snap, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/flatpak
          github-token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
          run-id: ${{ needs.flatpak.outputs.run-id }}

      - name: Download Snap artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/snap
          github-token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
          run-id: ${{ needs.snap.outputs.run-id }}

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/appimage
          github-token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
          run-id: ${{ needs.appimage.outputs.run-id }}

      - name: Collect release assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done
          ls -al release-assets

      - name: Prepare release inputs
        id: release_vars
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          NAME="${{ inputs.name }}"
          NOTES="${{ inputs.notes }}"
          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release drafted automatically. Update notes before publishing."
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.name }}
          body: ${{ steps.release_vars.outputs.notes }}
          draft: true
          files: release-assets/*
          token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
