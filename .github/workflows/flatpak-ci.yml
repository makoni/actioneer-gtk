name: Flatpak CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the Flatpak artifacts
        value: ${{ jobs.build.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Flatpak
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Allow git operations in workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: false

      - name: Vendor Rust dependencies
        shell: bash
        run: |
          rm -rf flatpak/vendor
          cargo vendor --locked --versioned-dirs flatpak/vendor

      - name: Stage Flatpak source directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flatpak/source
          mkdir -p flatpak/source
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C flatpak/source
          if [ -f Cargo.lock ]; then
            cp Cargo.lock flatpak/source/Cargo.lock
          fi

      - name: Ensure AppStream CLI runtime
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.flatpak.Builder

      - name: Render AppStream metainfo
        shell: bash
        run: |
          msgfmt --xml -L MetaInfo --template=data/metainfo.xml.in -d po -o data/metainfo.xml

      - name: Validate AppStream metadata
        shell: bash
        run: |
          flatpak run --command=appstreamcli org.flatpak.Builder validate --strict data/metainfo.xml

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          # Extract the version from the [package] section of Cargo.toml
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render Flatpak manifest
        shell: bash
        run: scripts/render-flatpak-manifest.sh --mode local

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/me.spaceinbox.actioneer.yaml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          build-bundle: true
          bundle: actioneer-${{ matrix.arch }}.flatpak
          upload-artifact: false
          run-tests: true
          arch: ${{ matrix.arch }}

      - name: Collect Flatpak bundle
        id: collect-bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle=$(find . -maxdepth 1 -name '*.flatpak' -print -quit)
          if [ -z "$bundle" ]; then
            echo "Bundle not found" >&2
            exit 1
          fi
          dest="dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.flatpak"
          mv "$bundle" "$dest"
          echo "bundle_path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.flatpak
          path: ${{ steps.collect-bundle.outputs.bundle_path }}

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      # NOTE: It's recommended to run the flathub linter and/or push a PR to flathub to use the
      # Flathub builders for final validation. This workflow is a starter template; adjust to
      # your CI policies and secrets as needed.
