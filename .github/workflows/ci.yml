name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lock-sync:
    uses: ./.github/workflows/lock-sync.yml

  fmt-clippy:
    name: Format and lint
    runs-on: ubuntu-latest
    needs: lock-sync
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential gettext
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and index
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install rustfmt and clippy
        run: |
          rustup component add clippy rustfmt

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  build-test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: fmt-clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential gettext

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo (target + registry)
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-stable-

      - name: Cargo build (debug)
        run: cargo build --workspace --all-targets --verbose

      - name: Compile translation catalogs
        run: bash scripts/compile-translations.sh

      - name: Cargo test (unit)
        run: cargo test --workspace --verbose

      - name: Cargo build (release)
        run: cargo build --workspace --release --verbose

      - name: Upload release binary artifact
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-actioneer-release-bin-${{ matrix.arch }}
          path: target/release/actioneer
          if-no-files-found: error
          retention-days: 3

  ui-integration:
    name: UI / integration tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-test
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install system packages (GUI deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config xvfb libx11-dev gettext \
            dbus dbus-x11 at-spi2-core

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo (target + registry)
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}-ui
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-stable-
      - name: Start Xvfb and run ignored UI tests
        env:
          DISPLAY: :99
          GTK_A11Y: none
        run: |
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          dbus-run-session -- bash -lc "RUST_TEST_THREADS=1 cargo test -- --ignored --test-threads=1"

  ui-smoke-tests:
    name: UI smoke tests
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install runtime + AT-SPI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 libglib2.0-0 \
            xvfb dbus dbus-x11 at-spi2-core python3-pyatspi gettext

      - name: Download prebuilt release binary
        uses: actions/download-artifact@v8
        with:
          name: ci-actioneer-release-bin-x86_64
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/actioneer

      - name: Compile translation catalogs
        run: bash scripts/compile-translations.sh

      - name: Run welcome-screen smoke test
        env:
          ACTIONEER_BIN: ${{ github.workspace }}/target/release/actioneer
        run: dbus-run-session -- bash tests/smoke/run_smoke.sh
