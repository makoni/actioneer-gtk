name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lock-sync:
    uses: ./.github/workflows/lock-sync.yml

  fmt-clippy:
    name: Format and lint
    runs-on: ubuntu-latest
    needs: lock-sync
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential gettext
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.3
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and index
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install rustfmt and clippy
        run: |
          rustup component add clippy rustfmt

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: fmt-clippy
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential gettext
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.3
        with:
          toolchain: ${{ matrix.toolchain }}
          cache: false
      
      - name: Cache cargo (target + registry)
        uses: actions/cache@v5.0.3
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-
      
      - name: Cargo build (debug)
        run: cargo build --workspace --all-targets --verbose

      - name: Compile translation catalogs
        run: bash scripts/compile-translations.sh
      
      - name: Cargo test (unit)
        run: cargo test --workspace --verbose
      
      - name: Cargo build (release)
        run: cargo build --workspace --release --verbose

  ui-integration:
    name: UI / integration tests
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install system packages (GUI deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config xvfb libx11-dev gettext

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.3
        with:
          toolchain: stable
          cache: false
          
      - name: Cache cargo (target + registry)
        uses: actions/cache@v5.0.3
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}-ui
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Start Xvfb and run ignored UI tests
        env:
          DISPLAY: :99
          GTK_A11Y: none
        run: |
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          RUST_TEST_THREADS=1 cargo test -- --ignored --test-threads=1
