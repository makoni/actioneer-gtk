name: AppImage CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the AppImage artifacts
        value: ${{ jobs.build.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build AppImage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            linuxdeploy_suffix: x86_64
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm64
          #   linuxdeploy_suffix: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    env:
      APPDIR: build/AppDir
      LINUXDEPLOY_PLUGIN_GTK: ${{ github.workspace }}/linuxdeploy-plugin-gtk.sh
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build release binary
        run: |
          cargo build --workspace --release --verbose


      - name: Get app version
        id: get_version
        shell: bash
        run: |
          # Extract the version from the [package] section of Cargo.toml
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download linuxdeploy and GTK plugin
        run: |
          set -euo pipefail
          curl -L "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_suffix }}.AppImage" -o linuxdeploy.AppImage
          curl -L "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" -o "$LINUXDEPLOY_PLUGIN_GTK"
          chmod +x linuxdeploy.AppImage "$LINUXDEPLOY_PLUGIN_GTK"

      - name: Build AppImage with linuxdeploy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf "$APPDIR"
          mkdir -p dist "$APPDIR/usr/share/metainfo" "$APPDIR/usr/share/licenses/actioneer"
          install -Dm644 data/metainfo.xml "$APPDIR/usr/share/metainfo/me.spaceinbox.actioneer.metainfo.xml"
          install -Dm644 LICENSE "$APPDIR/usr/share/licenses/actioneer/LICENSE"
          chmod +x packaging/AppRun.sh
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable target/release/actioneer \
            --desktop-file data/me.spaceinbox.actioneer.desktop \
            --icon-file icons/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg \
            --custom-apprun packaging/AppRun.sh \
            --plugin gtk \
            --output appimage
          OUTPUT_FILE=$(ls -1 Actioneer-*.AppImage | head -n 1)
          DEST="dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage"
          mv "$OUTPUT_FILE" "$DEST"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          path: dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
