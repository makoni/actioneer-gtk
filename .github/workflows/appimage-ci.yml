name: AppImage CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the AppImage artifacts
        value: ${{ jobs.package.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    uses: ./.github/workflows/build-release.yml

  package:
    name: Package AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy_suffix: x86_64
            linuxdeploy_sha256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          - arch: aarch64
            runner: ubuntu-24.04-arm
            linuxdeploy_suffix: aarch64
            linuxdeploy_sha256: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    env:
      APPDIR: build/AppDir
      LINUXDEPLOY_PLUGIN_GTK: ${{ github.workspace }}/linuxdeploy-plugin-gtk.sh
      # Pinned, with checksums: a release artifact must not depend on whatever
      # sat on someone else's branch the day it was built. linuxdeploy has no
      # stable channel, so this is its newest non-prerelease tag; the GTK plugin
      # publishes no releases at all, so it is pinned by commit.
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      LINUXDEPLOY_PLUGIN_GTK_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
      LINUXDEPLOY_PLUGIN_GTK_SHA256: b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
      # The GTK the AppImage must ship: the floor the crate compiles against
      # (`gtk4` feature `v4_14`). Anything older would load but lack symbols.
      MIN_BUNDLED_GTK: "4.14"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev desktop-file-utils gettext zsync

      - name: Download prebuilt release binary
        uses: actions/download-artifact@v8
        with:
          name: actioneer-release-bin-${{ matrix.arch }}
          path: dist/release-payload

      - name: Restore release layout
        run: |
          set -euo pipefail
          mkdir -p target/release po
          install -Dm755 dist/release-payload/bin/actioneer target/release/actioneer
          if [ -d dist/release-payload/locale ]; then
            rm -rf po/locale
            mkdir -p po/locale
            cp -r dist/release-payload/locale/. po/locale/
          fi

      - name: Render AppStream metainfo
        run: msgfmt --xml -L MetaInfo --template=data/metainfo.xml.in -d po -o data/metainfo.xml

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          # Extract the version from the [package] section of Cargo.toml
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download linuxdeploy and GTK plugin
        run: |
          set -euo pipefail
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${{ matrix.linuxdeploy_suffix }}.AppImage" -o linuxdeploy.AppImage
          curl -fL "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_PLUGIN_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh" -o "$LINUXDEPLOY_PLUGIN_GTK"
          echo "${{ matrix.linuxdeploy_sha256 }}  linuxdeploy.AppImage" | sha256sum --check --strict
          echo "${LINUXDEPLOY_PLUGIN_GTK_SHA256}  ${LINUXDEPLOY_PLUGIN_GTK}" | sha256sum --check --strict
          chmod +x linuxdeploy.AppImage "$LINUXDEPLOY_PLUGIN_GTK"

      - name: Build AppImage with linuxdeploy
        env:
          ARCH: ${{ matrix.arch }}
          # Bare filename, no directory: appimagetool takes this as its
          # destination and hands the same basename to zsyncmake, which writes
          # the .zsync next to it in the working directory.
          LDAI_OUTPUT: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|makoni|actioneer-gtk|latest|actioneer-*${{ matrix.arch }}.AppImage.zsync"
        run: |
          set -euo pipefail
          rm -rf "$APPDIR"
          mkdir -p dist "$APPDIR/usr/share/metainfo" "$APPDIR/usr/share/licenses/actioneer"
          install -Dm644 data/metainfo.xml "$APPDIR/usr/share/metainfo/me.spaceinbox.actioneer.metainfo.xml"
          install -Dm644 LICENSE "$APPDIR/usr/share/licenses/actioneer/LICENSE"
          chmod +x packaging/AppRun.sh
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable target/release/actioneer \
            --desktop-file data/me.spaceinbox.actioneer.desktop \
            --icon-file icons/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg \
            --custom-apprun packaging/AppRun.sh \
            --plugin gtk \
            --output appimage
          # linuxdeploy already produced the final name via $LDAI_OUTPUT. Do not
          # rename it: the .zsync carries this exact basename in its URL header,
          # and a renamed AppImage would leave that header pointing at nothing.
          if [ ! -f "$LDAI_OUTPUT" ]; then
            echo "linuxdeploy did not produce $LDAI_OUTPUT" >&2
            ls -1 *.AppImage 2>/dev/null >&2 || true
            exit 1
          fi
          if [ ! -f "$LDAI_OUTPUT.zsync" ]; then
            echo "No $LDAI_OUTPUT.zsync: zsyncmake did not run" >&2
            ls -1 *.zsync 2>/dev/null >&2 || true
            exit 1
          fi
          mv "$LDAI_OUTPUT" "$LDAI_OUTPUT.zsync" dist/

      - name: Verify the AppImage runs and carries its own GTK
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage"

          # 1. The bundle must actually contain GTK. If the plugin silently
          #    stops copying it, the AppImage would fall back to the host's GTK
          #    on machines that have one and fail outright on machines that do
          #    not — both of which look fine on this runner.
          bundled=$(find "$APPDIR" -name 'libgtk-4.so*' -printf '%f\n' | head -n 1)
          if [ -z "$bundled" ]; then
            echo "No libgtk-4 in the AppDir: the GTK plugin did not run" >&2
            find "$APPDIR/usr/lib" -maxdepth 1 -name 'lib*' -printf '  %f\n' | head -n 20 >&2
            exit 1
          fi
          echo "Bundled GTK library: $bundled"

          # 2. It must start, and report the GTK it loaded. `--version` prints
          #    the runtime's numbers, so this checks the library that answers at
          #    run time rather than the file that happens to sit in the AppDir.
          reported=$(APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE" --version)
          echo "AppImage reports: $reported"

          gtk_version=$(printf '%s' "$reported" | sed -n 's/.*gtk \([0-9][0-9.]*\).*/\1/p')
          if [ -z "$gtk_version" ]; then
            echo "Could not read a GTK version out of: $reported" >&2
            exit 1
          fi

          # 3. And it must not be older than what the crate compiles against.
          lowest=$(printf '%s\n%s\n' "$MIN_BUNDLED_GTK" "$gtk_version" | sort -V | head -n 1)
          if [ "$lowest" != "$MIN_BUNDLED_GTK" ]; then
            echo "Bundled GTK $gtk_version is older than the $MIN_BUNDLED_GTK the build needs" >&2
            exit 1
          fi
          echo "GTK $gtk_version satisfies the $MIN_BUNDLED_GTK floor"

          # 4. The update information must be embedded, and the .zsync must point
          #    back at this exact filename — the two halves that let a package
          #    manager find and fetch the next release.
          upd_info=$("./$APPIMAGE" --appimage-updateinformation)
          echo "Update information: $upd_info"
          expected_upd="gh-releases-zsync|makoni|actioneer-gtk|latest|actioneer-*${{ matrix.arch }}.AppImage.zsync"
          if [ "$upd_info" != "$expected_upd" ]; then
            echo "Embedded update information is not '$expected_upd'" >&2
            exit 1
          fi

          # `|| true` is load-bearing: grep -m1 stops reading, which SIGPIPEs
          # head and would trip `pipefail`. A missing key has to report itself
          # in the check below rather than killing the step with no message.
          zsync_header_url=$(head -c 4096 "$APPIMAGE.zsync" | grep -a -m1 '^URL:' | cut -d' ' -f2- || true)
          if [ -z "$zsync_header_url" ]; then
            echo "No 'URL:' line in $APPIMAGE.zsync: not a zsync file zsyncmake wrote" >&2
            head -c 256 "$APPIMAGE.zsync" | tr -d '\0' >&2 || true
            exit 1
          fi
          echo "zsync URL header: $zsync_header_url"
          if [ "$zsync_header_url" != "$(basename "$APPIMAGE")" ]; then
            echo "zsync URL header does not match the AppImage filename: the AppImage was renamed after zsyncmake ran" >&2
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          path: |
            dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
            dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage.zsync

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
