name: AppImage CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the AppImage artifacts
        value: ${{ jobs.build.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build AppImage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            appimagetool_suffix: x86_64
          #- arch: aarch64
          #  runner: ubuntu-24.04-arm64
          #  appimagetool_suffix: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    env:
      APPDIR: build/AppDir
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build release binary
        run: |
          cargo build --workspace --release --verbose

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          install -Dm755 target/release/actioneer "$APPDIR/usr/bin/actioneer"
          install -Dm644 data/me.spaceinbox.actioneer.desktop "$APPDIR/usr/share/applications/me.spaceinbox.actioneer.desktop"
          install -Dm644 data/metainfo.xml "$APPDIR/usr/share/metainfo/me.spaceinbox.actioneer.metainfo.xml"
          install -Dm644 LICENSE "$APPDIR/usr/share/licenses/actioneer/LICENSE"
          mkdir -p "$APPDIR/usr/share/icons"
          cp -a icons/icons/hicolor "$APPDIR/usr/share/icons/hicolor"
          install -Dm644 data/me.spaceinbox.actioneer.desktop "$APPDIR/me.spaceinbox.actioneer.desktop"
          install -Dm644 icons/icons/hicolor/512x512/apps/me.spaceinbox.actioneer.png "$APPDIR/me.spaceinbox.actioneer.png"
          printf '#!/bin/sh\nHERE="$(dirname "$0")"\nexec "$HERE/usr/bin/actioneer" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          # Extract the version from the [package] section of Cargo.toml
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          set -euo pipefail
          curl -L "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool_suffix }}.AppImage" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=${{ matrix.arch }}
          mkdir -p dist
          ./appimagetool.AppImage "$APPDIR" "dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          path: dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
