name: AppImage CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the AppImage artifacts
        value: ${{ jobs.package.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    uses: ./.github/workflows/build-release.yml

  package:
    name: Package AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # The AppImage bundles glibc and the dynamic loader along with GTK (see
      # packaging/anylinux-appimage.sh), so the build host's glibc no longer
      # sets a floor for users; verify-portability runs it on Ubuntu 22.04.
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    # Rolling, like the packages pacman installs into it; the tools the script
    # downloads are pinned by commit and checksum.
    container: ghcr.io/pkgforge-dev/archlinux:latest
    # The token below only downloads release assets; keep it read-only.
    permissions:
      contents: read
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    env:
      APPDIR: AppDir
      # The GTK the AppImage must ship: the floor the crate compiles against
      # (`gtk4` feature `v4_14`). Anything older would load but lack symbols.
      MIN_BUNDLED_GTK: "4.14"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          # Extract the version from the [package] section of Cargo.toml
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the AppImage
        shell: bash
        env:
          # get-debloated-pkgs asks api.github.com for its package list;
          # unauthenticated, a shared runner IP hits the 60-an-hour limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/anylinux-appimage.sh

      - name: Verify the AppImage runs and carries its own GTK
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage"

          # 1. The bundle must actually contain GTK and the C library. If
          #    quick-sharun silently stops deploying either, the AppImage
          #    would fall back to the host's copy on machines that have one
          #    and fail outright on machines that do not — both of which look
          #    fine on this runner.
          for lib in 'libgtk-4.so*' 'libc.so.6' 'ld-linux-*.so*'; do
            bundled=$(find "$APPDIR/lib" -name "$lib" -printf '%f\n' | head -n 1)
            if [ -z "$bundled" ]; then
              echo "No $lib in the AppDir: quick-sharun did not deploy it" >&2
              find "$APPDIR/lib" -maxdepth 1 -name 'lib*' -printf '  %f\n' | head -n 20 >&2
              exit 1
            fi
            echo "Bundled: $bundled"
          done

          # 2. It must start, and report the GTK it loaded. `--version` prints
          #    the runtime's numbers, so this checks the library that answers at
          #    run time rather than the file that happens to sit in the AppDir.
          reported=$("./$APPIMAGE" --appimage-extract-and-run --version | tail -n 1)
          echo "AppImage reports: $reported"

          gtk_version=$(printf '%s' "$reported" | sed -n 's/.*gtk \([0-9][0-9.]*\).*/\1/p')
          if [ -z "$gtk_version" ]; then
            echo "Could not read a GTK version out of: $reported" >&2
            exit 1
          fi

          # 3. And it must not be older than what the crate compiles against.
          lowest=$(printf '%s\n%s\n' "$MIN_BUNDLED_GTK" "$gtk_version" | sort -V | head -n 1)
          if [ "$lowest" != "$MIN_BUNDLED_GTK" ]; then
            echo "Bundled GTK $gtk_version is older than the $MIN_BUNDLED_GTK the build needs" >&2
            exit 1
          fi
          echo "GTK $gtk_version satisfies the $MIN_BUNDLED_GTK floor"

          # 4. The update information must be embedded, and the .zsync must point
          #    back at this exact filename — the two halves that let a package
          #    manager find and fetch the next release.
          upd_info=$("./$APPIMAGE" --appimage-updateinformation)
          echo "Update information: $upd_info"
          expected_upd="gh-releases-zsync|makoni|actioneer-gtk|latest|actioneer-*${{ matrix.arch }}.AppImage.zsync"
          if [ "$upd_info" != "$expected_upd" ]; then
            echo "Embedded update information is not '$expected_upd'" >&2
            exit 1
          fi

          # `|| true` is load-bearing: grep -m1 stops reading, which SIGPIPEs
          # head and would trip `pipefail`. A missing key has to report itself
          # in the check below rather than killing the step with no message.
          zsync_header_url=$(head -c 4096 "$APPIMAGE.zsync" | grep -a -m1 '^URL:' | cut -d' ' -f2- || true)
          if [ -z "$zsync_header_url" ]; then
            echo "No 'URL:' line in $APPIMAGE.zsync: not a zsync file zsyncmake wrote" >&2
            head -c 256 "$APPIMAGE.zsync" | tr -d '\0' >&2 || true
            exit 1
          fi
          echo "zsync URL header: $zsync_header_url"
          if [ "$zsync_header_url" != "$(basename "$APPIMAGE")" ]; then
            echo "zsync URL header does not match the AppImage filename: the AppImage was renamed after zsyncmake ran" >&2
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          path: |
            dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
            dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage.zsync

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  # The point of bundling glibc: the AppImage must start on a system whose C
  # library is older than the build container's. Ubuntu 22.04 (glibc 2.35) is
  # the oldest supported LTS and what the AppImage catalog tests on.
  verify-portability:
    name: Run AppImage on Ubuntu 22.04 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: package
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          version=$(awk -F '"' '/^\[package\]/{p=1} p && /^version/ {print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage
          path: dist

      - name: Start it
        shell: bash
        run: |
          set -euo pipefail
          ldd --version | sed -n 1p
          APPIMAGE="dist/actioneer-${{ steps.get_version.outputs.version }}-${{ matrix.arch }}.AppImage"
          chmod +x "$APPIMAGE"
          reported=$("./$APPIMAGE" --appimage-extract-and-run --version | tail -n 1)
          echo "AppImage reports: $reported"
          case "$reported" in
            "actioneer ${{ steps.get_version.outputs.version }} (gtk "*) ;;
            *) echo "Unexpected --version output: $reported" >&2; exit 1 ;;
          esac
