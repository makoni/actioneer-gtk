version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # gtk-rs-core crates are co-released in lockstep. Upgrading one in
      # isolation leaves the tree with two versions of `gio`/`glib` types and
      # breaks compilation. Keep them in a single PR.
      gtk-rs:
        patterns:
          - "gtk4"
          - "gtk4-*"
          - "gdk4"
          - "gdk4-*"
          - "gsk4"
          - "glib"
          - "glib-*"
          - "gio"
          - "pango"
          - "pango-*"
          - "cairo-rs"
          - "graphene-rs"
          - "libadwaita"
    ignore:
      # Phantom lockfile entry. keyring 3.6.x declares `secret-service` as an
      # optional dep behind the `async-secret-service` feature, which we never
      # enable (we use `sync-secret-service` → `dbus-secret-service`, which does
      # not depend on rand). Cargo still resolves optional deps into Cargo.lock
      # for reproducibility, so rand 0.8.x shows up even though it is not
      # compiled into the binary. Revisit once keyring 4.x ships stable.
      - dependency-name: rand
        versions: ["0.8.x"]
      # Block major bumps of gtk-rs-core crates: even with the `gtk-rs` group,
      # Dependabot opens PRs one crate at a time when a co-released peer hasn't
      # also updated, which leaves two versions of shared types in the graph
      # and breaks compilation (see closed PRs #19, #24). Major bumps of these
      # crates must be done as a coordinated manual migration, typically
      # alongside a GNOME Platform SDK bump.
      - dependency-name: gtk4
        update-types: ["version-update:semver-major"]
      - dependency-name: libadwaita
        update-types: ["version-update:semver-major"]
      - dependency-name: gio
        update-types: ["version-update:semver-major"]
      - dependency-name: glib
        update-types: ["version-update:semver-major"]
      - dependency-name: gdk4
        update-types: ["version-update:semver-major"]
      - dependency-name: gsk4
        update-types: ["version-update:semver-major"]
      - dependency-name: pango
        update-types: ["version-update:semver-major"]
      - dependency-name: cairo-rs
        update-types: ["version-update:semver-major"]
      - dependency-name: graphene-rs
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
