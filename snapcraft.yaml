name: actioneer
base: core24
version: '1.0.10'
title: Actioneer
summary: GitHub Actions desktop client for GNOME
description: |
  Actioneer is a native GTK4/libadwaita application that lets you browse GitHub
  repositories, inspect workflow runs, check job logs, and trigger background
  refreshes without leaving your desktop and integrates with GNOME notifications.
grade: stable
confinement: strict
license: MIT
contact: https://github.com/makoni/actioneer-gtk/issues
issues: https://github.com/makoni/actioneer-gtk/issues
source-code: https://github.com/makoni/actioneer-gtk
website: https://github.com/makoni/actioneer-gtk
icon: icons/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  actioneer:
    command: bin/actioneer
    extensions:
      - gnome
    plugs:
      - network
      - network-bind
      - gsettings
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - pulseaudio

parts:
  actioneer:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - libadwaita-1-dev
      - libgtk-4-dev
      - libssl-dev
      - pkg-config
      - on amd64 to arm64:
        - gcc-aarch64-linux-gnu
        - libadwaita-1-dev
        - libgtk-4-dev
        - libssl-dev
    stage-packages:
      - libssl3
    override-build: |
      craftctl default
      install -Dm644 "$CRAFT_PART_SRC/data/me.spaceinbox.actioneer.desktop" "$SNAPCRAFT_PART_INSTALL/meta/gui/me.spaceinbox.actioneer.desktop"
      sed -i 's|^Icon=me\.spaceinbox\.actioneer$|Icon=${SNAP}/meta/gui/me.spaceinbox.actioneer.svg|' "$SNAPCRAFT_PART_INSTALL/meta/gui/me.spaceinbox.actioneer.desktop"
      install -Dm644 "$SNAPCRAFT_PART_INSTALL/meta/gui/me.spaceinbox.actioneer.desktop" "$SNAPCRAFT_PART_INSTALL/snap/gui/me.spaceinbox.actioneer.desktop"
      install -Dm644 "$CRAFT_PART_SRC/icons/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg" "$SNAPCRAFT_PART_INSTALL/meta/gui/me.spaceinbox.actioneer.svg"
      install -Dm644 "$CRAFT_PART_SRC/icons/icons/hicolor/scalable/apps/actioneer.svg" "$SNAPCRAFT_PART_INSTALL/meta/gui/actioneer.svg"
      install -Dm644 "$CRAFT_PART_SRC/icons/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg" "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/me.spaceinbox.actioneer.svg"
    prime:
      # Drop development-only ICU helpers that trigger snap lint warnings but aren't needed at runtime
      - -usr/lib/aarch64-linux-gnu/libicutest.so.74.2
      - -usr/lib/aarch64-linux-gnu/libicuio.so.74.2
      - -usr/lib/x86_64-linux-gnu/libicutest.so.*
      - -usr/lib/x86_64-linux-gnu/libicuio.so.*
